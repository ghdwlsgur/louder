apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-kind-e2e-vault-outage
  namespace: cloud-cost
spec:
  refreshInterval: 10s
  secretStoreRef:
    name: vault-kind
    kind: ClusterSecretStore
  target:
    name: aws-kind-e2e-outage-credentials
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: finops/aws/kind
        property: access_key_id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: finops/aws/kind
        property: secret_access_key

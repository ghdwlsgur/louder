apiVersion: v1
kind: Namespace
metadata:
  name: cloud-cost
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: louder-operator
  namespace: cloud-cost
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: louder-operator
  namespace: cloud-cost
rules:
  - apiGroups:
      - finops.sre.local
    resources:
      - cloudaccounts
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - finops.sre.local
    resources:
      - cloudaccounts/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: louder-operator
  namespace: cloud-cost
subjects:
  - kind: ServiceAccount
    name: louder-operator
    namespace: cloud-cost
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: louder-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: louder-operator
  namespace: cloud-cost
  labels:
    app.kubernetes.io/name: louder-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: louder-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: louder-operator
    spec:
      serviceAccountName: louder-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: louder-operator:local
          imagePullPolicy: IfNotPresent
          args:
            - --watch-namespace=cloud-cost
            - --metrics-bind-address=0
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

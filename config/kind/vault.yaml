apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault-system
  labels:
    app.kubernetes.io/name: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vault
          image: hashicorp/vault:2.1.1
          args:
            - server
            - -dev
            - -dev-listen-address=0.0.0.0:8200
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: vault-bootstrap-token
                  key: token
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vault-bootstrap-token
                  key: token
          ports:
            - name: api
              containerPort: 8200
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/sys/health
              port: api
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault-system
spec:
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: api
      port: 8200
      targetPort: api
      protocol: TCP
